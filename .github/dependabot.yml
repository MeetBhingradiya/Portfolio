version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "Release"
    labels:
      - "🛍️ Scope : Dependencies"
      - "🚀 Type : Update"
      - "📦 Package : NPM"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "Release"
    schedule:
      interval: "weekly"
    labels:
      - "🛍️ Scope : Dependencies"
      - "🚀 Type : Update"
      - "📦 Package : PIP"